<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Main Circle with Gradient -->
  <circle cx="50" cy="50" r="42" fill="url(#grad)" filter="url(#shadow)"/>
  
  <!-- Letter T -->
  <text x="50" y="68" font-size="55" font-family="Arial, sans-serif" font-weight="bold" fill="white" text-anchor="middle">T</text>
  
  <!-- Coin Icon -->
  <circle cx="72" cy="28" r="14" fill="#fbbf24" filter="url(#shadow)"/>
  <text x="72" y="35" font-size="16" font-family="Arial, sans-serif" font-weight="bold" fill="#92400e" text-anchor="middle">$</text>
</svg>
